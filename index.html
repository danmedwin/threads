<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Thread Finder</title>
<style>
  :root {
    --tab-h: 58px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --bg: #F7F4F0;
    --text: #1C1A18;
    --muted: rgba(28,26,24,0.42);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    background: var(--bg); color: var(--text);
    transition: background 0.4s, color 0.4s;
  }

  /* ── PANELS ── */
  .panel {
    position: fixed;
    top: 0; left: 0; right: 0;
    bottom: calc(var(--tab-h) + var(--safe-b));
    display: none; overflow: hidden;
  }
  .panel.active { display: flex; flex-direction: column; }

  /* ── LOOKUP ── */
  #panel-lookup {
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem 1rem;
  }
  .lookup-eyebrow {
    font-size: 0.68rem; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; opacity: 0.45; margin-bottom: 2.8rem;
  }
  .input-wrap { width: 100%; max-width: 240px; margin-bottom: 3rem; }
  #colorInput {
    width: 100%; font-size: 3.2rem; font-weight: 700;
    text-align: center; border: none; border-bottom: 2px solid currentColor;
    background: transparent; color: inherit; padding: 0.2rem 0;
    outline: none; letter-spacing: 0.1em;
    -moz-appearance: textfield; appearance: textfield; caret-color: currentColor;
  }
  #colorInput::-webkit-inner-spin-button,
  #colorInput::-webkit-outer-spin-button { -webkit-appearance: none; }
  #colorInput::placeholder { opacity: 0.22; font-weight: 400; }
  #lookup-result {
    text-align: center; min-height: 8rem;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
  }
  .res-label { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.5; }
  .res-tray { font-size: 7.5rem; font-weight: 800; line-height: 0.95; letter-spacing: -0.03em; }
  .res-name { font-size: 0.9rem; font-style: italic; opacity: 0.6; margin-top: 6px; }
  .res-nocolor { font-size: 0.72rem; opacity: 0.38; margin-top: 5px; }
  .res-notfound { font-size: 1.2rem; font-weight: 500; opacity: 0.38; }

  /* ── CATALOG ── */
  #panel-catalog { display: none; flex-direction: column; }
  #panel-catalog.active { display: flex; }

  #carousel {
    flex: 1;
    display: flex;
    align-items: center;
    overflow-x: scroll;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    gap: 12px;
    padding: 16px 10vw;
  }
  #carousel::-webkit-scrollbar { display: none; }

  .catalog-card {
    flex: 0 0 80vw;
    scroll-snap-align: center;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.13);
    cursor: pointer;
    position: relative;
    background: #fff;
    transition: transform 0.15s ease;
  }
  .catalog-card:active { transform: scale(0.97); }

  .card-label {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 7px 10px 6px;
    font-size: 0.62rem; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(28,26,24,0.55);
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    text-align: center;
    border-bottom: 1px solid rgba(0,0,0,0.07);
    z-index: 2;
  }

  .card-img {
    width: 100%;
    height: calc(100dvh - var(--tab-h) - var(--safe-b) - 80px);
    object-fit: cover;
    object-position: top;
    display: block;
    margin-top: 30px;
  }

  /* ── FULLSCREEN ── */
  #fs-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0);
    pointer-events: none;
    transition: background 0.28s ease;
    display: flex; flex-direction: column;
  }
  #fs-overlay.open {
    background: rgba(0,0,0,0.96);
    pointer-events: auto;
  }

  #fs-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px 8px;
    padding-top: max(12px, env(safe-area-inset-top));
    opacity: 0; transition: opacity 0.28s;
  }
  #fs-overlay.open #fs-header { opacity: 1; }

  #fs-title {
    font-size: 0.75rem; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: rgba(255,255,255,0.6);
  }
  #fs-close {
    font-size: 1.4rem; color: rgba(255,255,255,0.7);
    background: none; border: none; cursor: pointer;
    padding: 4px 8px; line-height: 1;
  }

  #fs-image-wrap {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    opacity: 0; transition: opacity 0.28s;
  }
  #fs-overlay.open #fs-image-wrap { opacity: 1; }

  #fs-img {
    max-width: 100%;
    max-height: 100%;
    width: auto; height: auto;
    object-fit: contain;
    display: block;
    cursor: crosshair;
    touch-action: none;
  }

  #fs-hint {
    text-align: center;
    color: rgba(255,255,255,0.3);
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    padding: 6px 0 10px;
    opacity: 0; transition: opacity 0.28s;
  }
  #fs-overlay.open #fs-hint { opacity: 1; }

  /* ── RESULT TOAST ── */
  #toast {
    position: fixed;
    bottom: calc(var(--tab-h) + var(--safe-b) + 16px);
    left: 50%; transform: translateX(-50%) translateY(20px);
    background: #fff;
    border-radius: 16px;
    padding: 14px 28px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.22);
    text-align: center;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.22s ease, transform 0.22s ease;
    pointer-events: none;
    min-width: 180px;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast-code { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .toast-tray-label { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
  .toast-tray-num { font-size: 3.8rem; font-weight: 800; line-height: 1; letter-spacing: -0.02em; color: var(--text); }
  .toast-name { font-size: 0.8rem; font-style: italic; color: var(--muted); margin-top: 2px; }

  /* ── TAB BAR ── */
  #tab-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: calc(var(--tab-h) + var(--safe-b));
    padding-bottom: var(--safe-b);
    display: flex; z-index: 60;
    backdrop-filter: blur(24px) saturate(1.6);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    background: rgba(247,244,240,0.82);
    border-top: 1px solid rgba(0,0,0,0.09);
    transition: background 0.4s;
  }
  .tab-btn {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
    border: none; background: transparent; cursor: pointer;
    color: var(--muted); transition: color 0.2s; padding: 0;
  }
  .tab-btn.active { color: var(--text); }
  .tab-icon { font-size: 1.15rem; font-weight: 700; }
  .tab-label { font-size: 0.62rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; }
</style>
</head>
<body>

<!-- LOOKUP -->
<section id="panel-lookup" class="panel active">
  <p class="lookup-eyebrow">Madeira Polyneon</p>
  <div class="input-wrap">
    <input type="number" id="colorInput" inputmode="numeric"
      pattern="[0-9]*" placeholder="1500" autocomplete="off" autofocus>
  </div>
  <div id="lookup-result"></div>
</section>

<!-- CATALOG -->
<section id="panel-catalog" class="panel">
  <div id="carousel"></div>
</section>

<!-- FULLSCREEN OVERLAY -->
<div id="fs-overlay">
  <div id="fs-header">
    <span id="fs-title"></span>
    <button id="fs-close">✕</button>
  </div>
  <div id="fs-image-wrap">
    <img id="fs-img" src="" alt="">
  </div>
  <div id="fs-hint">Tap any color swatch</div>
</div>

<!-- TOAST -->
<div id="toast">
  <div class="toast-code" id="toast-code"></div>
  <div class="toast-tray-label">Tray</div>
  <div class="toast-tray-num" id="toast-tray"></div>
  <div class="toast-name" id="toast-name"></div>
</div>

<!-- TAB BAR -->
<nav id="tab-bar">
  <button class="tab-btn active" data-tab="lookup">
    <span class="tab-icon">#</span>
    <span class="tab-label">Lookup</span>
  </button>
  <button class="tab-btn" data-tab="catalog">
    <span class="tab-icon">⊞</span>
    <span class="tab-label">Catalog</span>
  </button>
</nav>

/* ─── UTILITIES ─── */
function luminance(r, g, b) {
  return [r,g,b].reduce((a,c,i) => {
    c /= 255;
    c = c <= 0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
    return a + c * [0.2126,0.7152,0.0722][i];
  }, 0);
}
function textColor(r, g, b) {
  return luminance(r,g,b) > 0.33 ? '#1C1A18' : '#ffffff';
}

/* ─── BUILD CAROUSEL ─── */
const carousel = document.getElementById('carousel');

CATALOG.forEach((spread, idx) => {
  const card = document.createElement('div');
  card.className = 'catalog-card';

  const label = document.createElement('div');
  label.className = 'card-label';
  label.textContent = spread.label;

  const img = document.createElement('img');
  img.className = 'card-img';
  img.src = spread.src;
  img.alt = spread.label;
  img.loading = 'lazy';

  card.appendChild(label);
  card.appendChild(img);
  card.addEventListener('click', () => openFullscreen(idx));
  carousel.appendChild(card);
});

/* ─── FULLSCREEN ─── */
const fsOverlay = document.getElementById('fs-overlay');
const fsImg     = document.getElementById('fs-img');
const fsTitle   = document.getElementById('fs-title');

let currentSpread = null;

function openFullscreen(idx) {
  currentSpread = CATALOG[idx];
  fsImg.src = currentSpread.src;
  fsTitle.textContent = currentSpread.label;
  fsOverlay.classList.add('open');
}

function closeFullscreen() {
  fsOverlay.classList.remove('open');
  hideToast();
}

document.getElementById('fs-close').addEventListener('click', closeFullscreen);

fsImg.addEventListener('click', handleImageTap);

function handleImageTap(e) {
  if (!currentSpread) return;
  e.stopPropagation();

  // Get the actual rendered image bounds (accounts for object-fit: contain letterboxing)
  const wrap    = document.getElementById('fs-image-wrap');
  const wRect   = wrap.getBoundingClientRect();
  const natW    = fsImg.naturalWidth  || 1;
  const natH    = fsImg.naturalHeight || 1;
  const natAR   = natW / natH;
  const boxAR   = wRect.width / wRect.height;

  let imgLeft, imgTop, imgW, imgH;
  if (natAR > boxAR) {
    // Width-constrained
    imgW    = wRect.width;
    imgH    = wRect.width / natAR;
    imgLeft = wRect.left;
    imgTop  = wRect.top + (wRect.height - imgH) / 2;
  } else {
    // Height-constrained
    imgH    = wRect.height;
    imgW    = wRect.height * natAR;
    imgTop  = wRect.top;
    imgLeft = wRect.left + (wRect.width - imgW) / 2;
  }

  const relX = (e.clientX - imgLeft) / imgW;
  const relY = (e.clientY - imgTop)  / imgH;

  // Guard: tap was outside image area
  if (relX < 0 || relX > 1 || relY < 0 || relY > 1) return;

  // Which column?
  const colIdx = relX < 0.5 ? 0 : 1;
  const col = currentSpread.cols[colIdx];

  // Map Y to swatch index
  const activeFrac = 1 - TOP_FRAC - BOT_FRAC;
  const swatchY    = (relY - TOP_FRAC) / activeFrac;
  const rawIdx     = Math.floor(swatchY * col.codes.length);
  const swatchIdx  = Math.max(0, Math.min(col.codes.length - 1, rawIdx));

  const code = col.codes[swatchIdx];
  const tray = col.tray;
  const name = NAMES[code] || '';

  showToast(code, tray, name);
}

/* ─── TOAST ─── */
let toastTimer = null;
const toast     = document.getElementById('toast');
const toastCode = document.getElementById('toast-code');
const toastTray = document.getElementById('toast-tray');
const toastName = document.getElementById('toast-name');

function showToast(code, tray, name) {
  toastCode.textContent = `#${code}`;
  toastTray.textContent = tray;
  toastName.textContent = name;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 3000);
}

function hideToast() {
  toast.classList.remove('show');
}

/* ─── TABS ─── */
let activeTab = 'lookup';

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    if (tab === activeTab) return;
    activeTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `panel-${tab}`));

    if (tab === 'lookup') {
      // Restore lookup bg if a color is active
      if (activeLookupColor) applyLookupBg(activeLookupColor);
      setTimeout(() => document.getElementById('colorInput').focus(), 100);
    } else {
      resetBg();
    }
  });
});

/* ─── LOOKUP ─── */
let activeLookupColor = null;

function applyLookupBg(rgb) {
  activeLookupColor = rgb;
  if (activeTab !== 'lookup') return;
  if (rgb) {
    const [r, g, b] = rgb;
    const tc = textColor(r, g, b);
    document.body.style.backgroundColor = `rgb(${r},${g},${b})`;
    document.body.style.color = tc;
    document.getElementById('tab-bar').style.backgroundColor = `rgba(${r},${g},${b},0.72)`;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.style.color = tc === '#ffffff'
        ? (btn.classList.contains('active') ? 'rgba(255,255,255,0.95)' : 'rgba(255,255,255,0.45)')
        : (btn.classList.contains('active') ? 'rgba(28,26,24,0.95)' : 'rgba(28,26,24,0.42)');
    });
  } else { resetBg(); }
}

function resetBg() {
  document.body.style.backgroundColor = '';
  document.body.style.color = '';
  document.getElementById('tab-bar').style.backgroundColor = '';
  document.querySelectorAll('.tab-btn').forEach(btn => btn.style.color = '');
}

const input    = document.getElementById('colorInput');
const resultEl = document.getElementById('lookup-result');

input.addEventListener('input', () => {
  const raw  = input.value.trim();
  const code = parseInt(raw, 10);

  if (raw.length < 4) {
    resultEl.innerHTML = '';
    applyLookupBg(null);
    return;
  }

  if (TRAYS.hasOwnProperty(code)) {
    const tray = TRAYS[code];
    const rgb  = COLORS[code];
    const name = NAMES[code];

    if (rgb) {
      applyLookupBg(rgb);
      resultEl.innerHTML = `
        <div class="res-label">Tray</div>
        <div class="res-tray">${tray}</div>
        ${name ? `<div class="res-name">${name}</div>` : ''}
      `;
    } else {
      applyLookupBg(null);
      resultEl.innerHTML = `
        <div class="res-label">Tray</div>
        <div class="res-tray">${tray}</div>
        <div class="res-nocolor">No color preview for this code</div>
      `;
    }
  } else {
    applyLookupBg(null);
    resultEl.innerHTML = `<div class="res-notfound">Color ${code} not found</div>`;
  }
});
